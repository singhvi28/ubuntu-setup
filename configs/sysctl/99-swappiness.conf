# Memory-CPU Tradeoff Optimization (Max-CPU / Aggressive Mode)
# Maximum preference for zstd-compressing cold anonymous memory into RAM (zswap)
vm.swappiness = 180

# Decompress single 4K pages on page-fault (zero read-ahead waste in RAM)
vm.page-cluster = 0

# Actively reclaim unused VFS dentry/inode caches to free physical RAM
vm.vfs_cache_pressure = 130

# Spend background CPU continuously compacting physical RAM to prevent fragmentation
vm.compaction_proactiveness = 80

# Wake kswapd early so background CPU threads compress cold pages ahead of demand
vm.watermark_scale_factor = 50
vm.watermark_boost_factor = 0
