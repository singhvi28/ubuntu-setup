# Balanced Memory-CPU Tradeoff Optimization
# With zswap enabled, swappiness=80 encourages the kernel to compress idle memory
# into RAM using CPU zstd compression rather than dropping useful disk caches.
vm.swappiness = 80

# Decompress single 4KB pages on demand (optimal for RAM-backed zswap random I/O)
vm.page-cluster = 0

# Reclaim VFS directory and inode caches at normal rate
vm.vfs_cache_pressure = 100

# Spend background CPU cycles to compact physical memory and reduce fragmentation
vm.compaction_proactiveness = 20

# Smooth kswapd wakeup
vm.watermark_scale_factor = 10
