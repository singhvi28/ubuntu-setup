[Service]
# Unload idle LLM models from RAM/VRAM after 3 minutes instead of keeping them pinned
Environment="OLLAMA_KEEP_ALIVE=3m"
# Limit concurrent loaded models to 1 to prevent RAM exhaustion on 16GB laptops
Environment="OLLAMA_MAX_LOADED_MODELS=1"
# Enable Flash Attention to significantly reduce KV-cache memory usage during inference
Environment="OLLAMA_FLASH_ATTENTION=1"
# Quantize KV cache to q8_0 to halve context memory footprint using CPU/GPU compute
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
