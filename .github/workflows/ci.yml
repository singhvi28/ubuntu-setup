name: Validate Setup Scripts & Configs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Syntax, ShellCheck & JSON Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax (bash -n)
        run: |
          bash -n bootstrap.sh
          for script in scripts/*.sh scripts/nsfw-restriction/*.sh dotfiles/.local/bin/ram-status; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done

      - name: Run ShellCheck (severity=error)
        run: |
          shellcheck --severity=error bootstrap.sh scripts/*.sh scripts/nsfw-restriction/*.sh dotfiles/.local/bin/ram-status

      - name: Validate JSON files
        run: |
          python3 - << 'EOF'
          import json, glob, sys
          for path in glob.glob("packages/*.json") + glob.glob("configs/**/*.json", recursive=True) + glob.glob("dotfiles/**/*.json", recursive=True):
              print(f"Validating JSON: {path}")
              with open(path) as f:
                  json.load(f)
          EOF
